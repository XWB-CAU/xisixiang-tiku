<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#c8102e">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="习思想题库">
<meta name="application-name" content="习思想题库">
<title>习思想题库 · 150题</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--red:#c8102e;--red-d:#a30d25;--red-l:#fdeef0;
--bg:#f5f6f8;--card:#fff;--tx:#1a1a1a;--tx2:#6b7280;--tx3:#9ca3af;
--line:#e8eaed;--ok:#079455;--ok-bg:#e8f7ef;--no:#d92d20;--no-bg:#fdecea;
--gold:#f59e0b;--gold-bg:#fff7e6;
--safe-b:env(safe-area-inset-bottom,0px);
--tabh:56px;   /* 底部导航条高度，用于给内容留出安全间距 */
}
html,body{height:100%}
body{
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--tx);line-height:1.6;
font-size:16px;-webkit-font-smoothing:antialiased;
overscroll-behavior-y:none;
}
#app{max-width:720px;margin:0 auto;min-height:100%;position:relative;background:var(--bg);}
.screen{display:none;min-height:100vh;min-height:100dvh;flex-direction:column}
.screen.on{display:flex}

/* ---------- 顶部栏 ---------- */
.hd{
position:sticky;top:0;z-index:50;
background:linear-gradient(135deg,#c8102e,#8f0a20);
color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;
display:flex;align-items:center;gap:12px;
box-shadow:0 2px 12px rgba(143,10,32,.25);
}
.hd h1{font-size:17px;font-weight:600;flex:1;letter-spacing:.3px}
.hd .sub{font-size:12px;opacity:.85;font-weight:400}
.iconbtn{
width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);
border:none;color:#fff;display:flex;align-items:center;justify-content:center;
font-size:17px;cursor:pointer;flex-shrink:0;transition:background .2s;
}
.iconbtn:active{background:rgba(255,255,255,.3)}

/* ---------- 首页 ---------- */
.hero{padding:20px 16px 6px}
.hero .t{font-size:13px;color:var(--tx2);margin-bottom:14px;letter-spacing:.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.stat b{display:block;font-size:20px;color:var(--red);font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--tx3)}
.progress-wrap{background:var(--card);border-radius:16px;padding:16px;margin-bottom:18px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.progress-wrap .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:9px}
.progress-wrap .row b{color:var(--red);font-variant-numeric:tabular-nums}
.bar{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e8445f,#c8102e);border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.sec-t{font-size:13px;color:var(--tx2);margin:0 4px 10px;font-weight:500}

.modes{display:flex;flex-direction:column;gap:10px;padding:0 16px calc(var(--tabh) + 28px + var(--safe-b))}
.mode{
background:var(--card);border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;
box-shadow:0 1px 6px rgba(0,0,0,.05);cursor:pointer;transition:transform .15s,box-shadow .15s;
border:1px solid transparent;
}
.mode:active{transform:scale(.985);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mode .ico{
width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
font-size:22px;flex-shrink:0;
}
.mode .tx{flex:1;min-width:0}
.mode .tx b{display:block;font-size:15.5px;font-weight:600;margin-bottom:2px}
.mode .tx span{font-size:12.5px;color:var(--tx3);display:block;line-height:1.4}
.mode .arr{color:var(--tx3);font-size:18px;flex-shrink:0}
.mode.hl{border-color:#f6c9d1;background:linear-gradient(135deg,#fff,#fff9fa)}
.badge{display:inline-block;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:99px;margin-left:5px;vertical-align:1px;font-weight:500}

/* ---------- 答题页 ---------- */
.qbar{padding:10px 16px 12px;background:var(--bg);position:sticky;top:0;z-index:40;
padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
.qbar-in{display:flex;align-items:center;gap:12px}
.qbar .num{font-size:15px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums;white-space:nowrap}
.qbar .num em{font-style:normal;color:var(--tx3);font-weight:400;font-size:13px}
.qbar .bar{flex:1;height:5px}
.qbar .pct{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}

.qbox{padding:0 16px 16px;flex:1}
.qcard{background:var(--card);border-radius:18px;padding:18px 16px;box-shadow:0 1px 8px rgba(0,0,0,.05)}
.qtag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--red);background:var(--red-l);
padding:3px 9px;border-radius:99px;margin-bottom:11px;font-weight:500}
.qtag.warn{color:#b45309;background:var(--gold-bg)}
.qstem{font-size:16.5px;line-height:1.75;color:var(--tx);letter-spacing:.1px;margin-bottom:16px;text-align:justify}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
display:flex;gap:11px;padding:13px 14px;border-radius:13px;background:#fafbfc;
border:1.5px solid var(--line);cursor:pointer;transition:all .18s;align-items:flex-start;
}
.opt:active{transform:scale(.99)}
.opt .k{
width:25px;height:25px;border-radius:50%;background:#fff;border:1.5px solid #d5d8dd;
display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
color:var(--tx2);flex-shrink:0;margin-top:1px;transition:all .18s;
}
.opt .t{flex:1;font-size:15px;line-height:1.65;color:var(--tx);text-align:justify}
.opt.sel{border-color:var(--red);background:var(--red-l)}
.opt.sel .k{background:var(--red);border-color:var(--red);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.wrong .k{background:var(--no);border-color:var(--no);color:#fff}
.opt.locked{cursor:default}
.opt.locked:active{transform:none}
.opt.dim{opacity:.55}

.verdict{margin-top:16px;border-radius:14px;padding:13px 15px;font-size:14.5px;display:none;align-items:flex-start;gap:9px;line-height:1.6}
.verdict.show{display:flex;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.verdict.ok{background:var(--ok-bg);color:#046c3d}
.verdict.no{background:var(--no-bg);color:#a21d15}
.verdict .vi{font-size:17px;line-height:1.3}
.verdict b{font-weight:700}
.verdict .note{display:block;font-size:12px;opacity:.8;margin-top:3px;font-weight:400}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}

.actbar{
position:sticky;bottom:0;background:rgba(245,246,248,.94);backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
padding:11px 16px calc(11px + var(--safe-b));display:flex;gap:10px;z-index:45;
}
.btn{
flex:1;height:46px;border-radius:13px;border:none;font-size:15.5px;font-weight:600;
cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;
font-family:inherit;
}
.btn:active{transform:scale(.98)}
.btn.main{background:linear-gradient(135deg,#e0203c,#b30b25);color:#fff;box-shadow:0 3px 10px rgba(200,16,46,.28)}
.btn.main:disabled{background:#d7d9dd;color:#fff;box-shadow:none;cursor:not-allowed;transform:none}
.btn.ghost{background:#fff;color:var(--tx2);border:1.5px solid var(--line);flex:0 0 auto;padding:0 17px}
.btn.ghost:active{background:#f0f1f3}
.btn.sm{height:38px;font-size:14px;border-radius:10px}

/* ---------- 列表/结果页 ---------- */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(var(--tabh) + 34px + var(--safe-b))}
/* 成绩页无底部导航，底部是 actbar，不需要预留导航条高度 */
#scr-result .scroll{padding-bottom:24px}
.empty{text-align:center;padding:60px 20px;color:var(--tx3)}
.empty .em{font-size:46px;margin-bottom:14px;opacity:.85}
.empty b{display:block;font-size:16px;color:var(--tx2);margin-bottom:6px;font-weight:600}
.empty p{font-size:13.5px;line-height:1.7}

.qitem{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,.04);cursor:pointer}
.qitem .qi-h{display:flex;gap:9px;margin-bottom:7px;align-items:flex-start}
.qitem .qi-n{font-size:12px;font-weight:700;color:var(--red);background:var(--red-l);border-radius:6px;padding:1px 7px;flex-shrink:0;font-variant-numeric:tabular-nums}
.qitem .qi-s{flex:1;font-size:14px;line-height:1.55;color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qitem .qi-f{font-size:12.5px;color:var(--tx3);display:flex;gap:12px;flex-wrap:wrap}
.qitem .qi-f i{font-style:normal}
.qitem .qi-f .r{color:var(--ok);font-weight:600}
.qitem .qi-f .w{color:var(--no);font-weight:600}

/* ---------- 模拟考试 ---------- */
.exam-hd{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
.timer{font-family:ui-monospace,Menlo,monospace;font-size:17px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.timer.danger{color:var(--no);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.sheet{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;padding:16px}
.sheet i{
aspect-ratio:1;border-radius:10px;background:#fff;border:1.5px solid var(--line);
display:flex;align-items:center;justify-content:center;font-size:14px;font-style:normal;
color:var(--tx2);cursor:pointer;font-variant-numeric:tabular-nums;font-weight:500;
}
.sheet i.done{background:var(--red);border-color:var(--red);color:#fff}
.sheet i.cur{border-color:var(--red);border-width:2.5px;color:var(--red);font-weight:700}
.sheet i.wr{background:var(--no-bg);border-color:#f5b5b0;color:var(--no)}
.sheet i.rt{background:var(--ok-bg);border-color:#a8e0c2;color:var(--ok)}

/* 结果 */
.score-wrap{background:linear-gradient(160deg,#c8102e,#7d0a1c);padding:34px 20px 30px;text-align:center;color:#fff}
.score-num{font-size:60px;font-weight:800;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.score-num small{font-size:17px;font-weight:500;opacity:.8;margin-left:3px}
.score-lb{font-size:14px;opacity:.9;margin-top:9px}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.18);border-radius:14px;overflow:hidden;margin-top:22px}
.score-grid div{background:rgba(255,255,255,.07);padding:12px 6px}
.score-grid b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.score-grid span{font-size:11.5px;opacity:.8}

/* 底部导航 */
.tabbar{
position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:720px;
background:rgba(255,255,255,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b);z-index:60;
}
.tabbar a{
flex:1;padding:7px 0 6px;text-align:center;font-size:10.5px;color:var(--tx3);text-decoration:none;
display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s;
}
.tabbar a .ti{font-size:19px;line-height:1.15}
.tabbar a.on{color:var(--red);font-weight:600}

/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:100;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheetbox{background:#fff;width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--safe-b));animation:slideup .28s cubic-bezier(.4,0,.2,1);max-height:82vh;overflow-y:auto}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheetbox h3{font-size:16px;margin-bottom:4px;text-align:center}
.sheetbox .hint{font-size:12.5px;color:var(--tx3);text-align:center;margin-bottom:16px}

.toast{
position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
background:rgba(0,0,0,.8);color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;
z-index:200;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;max-width:80%;
}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.hide{display:none!important}

/* 设置项 + 开关 */
.setrow{
display:flex;align-items:center;gap:12px;background:#f7f8fa;border-radius:12px;
padding:13px 14px;cursor:pointer;transition:background .15s;
}
.setrow:active{background:#eef0f3}
.setrow>div:first-child{flex:1;min-width:0}
.setrow b{display:block;font-size:14.5px;font-weight:600;color:var(--tx);margin-bottom:2px}
.setrow span{font-size:12px;color:var(--tx3);line-height:1.4;display:block}
.sw{
width:46px;height:27px;border-radius:99px;background:#d5d8dd;position:relative;
flex-shrink:0;transition:background .22s;
}
.sw i{
position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;
background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .22s;
}
.sw.on{background:var(--red)}
.sw.on i{transform:translateX(19px)}

/* 同步设置 */
.syncinput{
width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;
font-size:13.5px;font-family:inherit;min-height:70px;resize:vertical;outline:none;
background:#fafbfc;color:var(--tx);line-height:1.5;word-break:break-all;
}
.syncinput:focus{border-color:var(--red);background:#fff}
.tip{
margin-top:12px;background:#f7f8fa;border-radius:12px;padding:12px 14px;
font-size:12.5px;color:var(--tx2);line-height:1.9;
}
.tip a{color:var(--red);text-decoration:none;word-break:break-all}
.tip .warn{color:var(--tx3);font-size:11.5px;display:inline-block;margin-top:2px}
</style>
</head>
<body>
<div id="app">
  <!-- 首页 -->
  <div class="screen" id="scr-home">
    <div class="hd">
      <div style="flex:1">
        <h1>习思想题库</h1>
        <div class="sub" id="homeSub">习思想题库 · 150 题</div>
      </div>
      <button class="iconbtn" onclick="App.openSettings()" aria-label="设置">⚙</button>
    </div>
    <div class="hero">
      <div class="stats">
        <div class="stat"><b id="stTotal">150</b><span>题库总量</span></div>
        <div class="stat"><b id="stDone">0</b><span>已练习</span></div>
        <div class="stat"><b id="stWrong">0</b><span>错题数</span></div>
        <div class="stat"><b id="stRate">--</b><span>正确率</span></div>
      </div>
      <div class="progress-wrap">
        <div class="row"><span>学习进度</span><b id="pgTxt">0 / 150</b></div>
        <div class="bar"><i id="pgBar" style="width:0%"></i></div>
      </div>
      <div class="sec-t">开始刷题</div>
    </div>
    <div class="modes" id="modeList"></div>
  </div>

  <!-- 答题页 -->
  <div class="screen" id="scr-quiz">
    <div class="qbar">
      <div class="qbar-in">
        <button class="iconbtn" style="background:#e8eaed;color:#5b6470" onclick="App.exitQuiz()" aria-label="返回">‹</button>
        <div class="num"><span id="qIdx">1</span> <em>/ <span id="qTot">150</span></em></div>
        <div class="bar"><i id="qBar" style="width:0%"></i></div>
        <div class="pct" id="qPct">0%</div>
      </div>
    </div>
    <div class="qbox">
      <div class="qcard">
        <div id="qTag" class="qtag">顺序练习</div>
        <div class="qstem" id="qStem"></div>
        <div class="opts" id="qOpts"></div>
        <div class="verdict" id="qVerdict"></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn ghost sm" style="flex:1" onclick="App.toggleFav()" id="favBtn">☆ 收藏</button>
        <button class="btn ghost sm" style="flex:1" onclick="App.openSheet()">☰ 答题卡</button>
      </div>
    </div>
    <div class="actbar">
      <button class="btn ghost" onclick="App.prevQ()">上一题</button>
      <button class="btn main" id="nextBtn" onclick="App.nextQ()">下一题</button>
    </div>
  </div>

  <!-- 错题本 -->
  <div class="screen" id="scr-wrong">
    <div class="hd">
      <button class="iconbtn" onclick="App.go('home')" aria-label="返回">‹</button>
      <h1>错题本 <span class="sub" id="wrongCnt"></span></h1>
      <button class="iconbtn" onclick="App.clearWrong()" aria-label="清空">🗑</button>
    </div>
    <div class="scroll" id="wrongList" style="padding-top:14px"></div>
  </div>

  <!-- 收藏 -->
  <div class="screen" id="scr-fav">
    <div class="hd">
      <button class="iconbtn" onclick="App.go('home')" aria-label="返回">‹</button>
      <h1>我的收藏 <span class="sub" id="favCnt"></span></h1>
    </div>
    <div class="scroll" id="favList" style="padding-top:14px"></div>
  </div>

  <!-- 考试结果 -->
  <div class="screen" id="scr-result">
    <div class="score-wrap">
      <div class="score-num" id="rsScore">0<small>分</small></div>
      <div class="score-lb" id="rsLabel"></div>
      <div class="score-grid">
        <div><b id="rsOk">0</b><span>答对</span></div>
        <div><b id="rsNo">0</b><span>答错</span></div>
        <div><b id="rsTime">0'</b><span>用时</span></div>
      </div>
    </div>
    <div class="scroll" id="rsList" style="padding-top:16px"></div>
    <div class="actbar">
      <button class="btn ghost" onclick="App.go('home')">返回首页</button>
      <button class="btn main" onclick="App.retryExam()">再考一次</button>
    </div>
  </div>

  <div class="tabbar" id="tabbar">
    <a href="javascript:;" data-tab="home" class="on" onclick="App.go('home')"><span class="ti">🏠</span>首页</a>
    <a href="javascript:;" data-tab="order" onclick="App.start('order')"><span class="ti">📖</span>顺序</a>
    <a href="javascript:;" data-tab="random" onclick="App.start('random')"><span class="ti">🎲</span>随机</a>
    <a href="javascript:;" data-tab="wrong" onclick="App.go('wrong')"><span class="ti">📕</span>错题<span id="tabDot"></span></a>
    <a href="javascript:;" data-tab="fav" onclick="App.go('fav')"><span class="ti">⭐</span>收藏</a>
  </div>
</div>

<div class="mask" id="mask" onclick="if(event.target===this)App.closeSheet()">
  <div class="sheetbox" id="sheetbox"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===BANK_START=== */

<script>const APP_VER = '9c65a9dcff';</script>
<script>
/* ===APP_START=== */
  /* ============ 刷题宝典 核心逻辑 ============ */
'use strict';

/* 版本号（构建时注入，测试环境缺失则回退） */
const VER = (typeof APP_VER !== 'undefined' ? APP_VER : 'dev');

/* 题库容量（用于初始化） */
const _TOTAL = BANK.length;

const App = (() => {
  /* ---------- 存储 ---------- */
  const KEY = 'stbd_v1';
  const DEF = () => ({
    done: {},        // id -> {r:'right'|'wrong', n:次数, ts}
    wrong: {},       // id -> {n:错次数, ts}
    fav: {},         // id -> ts
    pos: 0,          // 顺序模式进度
    randSeed: -1,    // 随机模式当前题序
    shuf: false,     // 选项乱序开关
    syncAt: 0,       // 上次同步时间
    exam: null,      // 未完成的考试
    examHist: []     // 历次成绩
  });
  let S = DEF();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) S = Object.assign(DEF(), JSON.parse(raw));
    } catch (e) { S = DEF(); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  /* ---------- 工具 ---------- */
  const $ = id => document.getElementById(id);
  const Q = id => BANK.find(q => q.id === id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let toastT = null;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('on'), 1500);
  }

  /* ---------- 页面切换 ---------- */
  let cur = 'home';
  function go(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
    const el = $('scr-' + name);
    if (el) el.classList.add('on');
    cur = name;
    window.scrollTo(0, 0);
    // tabbar 高亮
    document.querySelectorAll('.tabbar a').forEach(a => a.classList.remove('on'));
    const map = { home: 'home', wrong: 'wrong', fav: 'fav', quiz: Quiz.tab };
    const tb = document.querySelector('.tabbar a[data-tab="' + (map[name] || name) + '"]');
    if (tb) tb.classList.add('on');
    $('tabbar').classList.toggle('hide', name === 'quiz' || name === 'result');
    if (name === 'home') renderHome();
    if (name === 'wrong') renderWrong();
    if (name === 'fav') renderFav();
  }

  /* ---------- 首页 ---------- */
  function renderHome() {
    const total = BANK.length;
    const doneIds = Object.keys(S.done);
    const doneN = doneIds.length;
    let rightN = 0, wrongN = 0;
    doneIds.forEach(id => {
      if (S.done[id].r === 'right') rightN++; else wrongN++;
    });
    const rate = doneN ? Math.round(rightN / doneN * 100) : null;
    $('stTotal').textContent = total;
    $('stDone').textContent = doneN;
    $('stWrong').textContent = Object.keys(S.wrong).length;
    $('stRate').textContent = rate === null ? '--' : rate + '%';
    $('pgTxt').textContent = doneN + ' / ' + total;
    $('pgBar').style.width = (doneN / total * 100) + '%';

    const wrongCount = Object.keys(S.wrong).length;
    const modes = [
      { k: 'order', ico: '📖', bg: '#fdeef0', title: '顺序刷题', desc: S.pos > 0 ? ('上次做到第 ' + (S.pos + 1) + ' 题，继续即可') : '按题号 1 → 150 逐题练习', arr: '›' },
      { k: 'random', ico: '🎲', bg: '#eef6ff', title: '随机刷题', desc: '打乱题库顺序，随机抽题练习', arr: '›' },
      { k: 'wrong', ico: '📕', bg: '#fdecea', title: '错题本', desc: wrongCount ? ('共 ' + wrongCount + ' 道错题待攻克') : '还没有错题，继续保持', arr: '›', badge: wrongCount || 0 },
      { k: 'exam', ico: '📝', bg: '#fff7e6', title: '模拟考试', desc: '随机 50 题 · 限时 30 分钟 · 自动判分', arr: '›' },
      { k: 'fav', ico: '⭐', bg: '#f3f0ff', title: '我的收藏', desc: (Object.keys(S.fav).length || '暂无') + (Object.keys(S.fav).length ? ' 道重点题' : '收藏题'), arr: '›' }
    ];
    $('modeList').innerHTML = modes.map(m => `
      <div class="mode" onclick="App.modeClick('${m.k}')">
        <div class="ico" style="background:${m.bg}">${m.ico}</div>
        <div class="tx"><b>${m.title}${m.badge ? '<span class="badge">' + m.badge + '</span>' : ''}</b><span>${esc(m.desc)}</span></div>
        <div class="arr">${m.arr}</div>
      </div>`).join('');
  }

  function modeClick(k) {
    if (k === 'wrong') return go('wrong');
    if (k === 'fav') return go('fav');
    if (k === 'exam') return Exam.start();
    start(k);
  }

  /* ---------- 刷题会话 ---------- */
  const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

  const Quiz = {
    list: [], idx: 0, mode: 'order', answered: {}, tab: 'order', disp: null,
    init(ids, mode, startIdx) {
      this.list = ids;
      this.mode = mode;
      this.idx = startIdx || 0;
      this.tab = mode === 'wrong' ? 'wrong' : mode === 'fav' ? 'fav' : (mode === 'random' ? 'random' : 'order');
      this.answered = {};
      this.disp = {};   // 每题的选项显示顺序（本次会话内固定，翻页不会乱跳）
      go('quiz');
      this.render();
    },
    // 取该题的显示顺序：返回原始选项 key 的数组
    getDisp(q) {
      if (!this.disp) this.disp = {};
      if (!this.disp[q.id]) {
        const keys = q.o.map(o => o.k);
        this.disp[q.id] = S.shuf ? shuffle(keys) : keys;
      }
      return this.disp[q.id];
    },
    render() {
      const id = this.list[this.idx];
      if (id === undefined) { this.finish(); return; }
      const q = Q(id);
      if (!q) { this.finish(); return; }
      const total = this.list.length;
      $('qIdx').textContent = this.idx + 1;
      $('qTot').textContent = total;
      $('qBar').style.width = ((this.idx + 1) / total * 100) + '%';
      const pctEl = $('qPct');
      pctEl.style.color = '';
      pctEl.style.fontWeight = '';
      if (this.mode === 'exam') {
        const left = Exam.left || 0;
        const mm = Math.floor(left / 60000), ss = Math.floor(left % 60000 / 1000);
        pctEl.textContent = mm + ':' + String(ss).padStart(2, '0');
        pctEl.style.color = left < 300000 ? '#d92d20' : '#c8102e';
        pctEl.style.fontWeight = '700';
      } else {
        pctEl.textContent = ((this.idx + 1) / total * 100 | 0) + '%';
      }

      const tagNames = { order: '顺序练习', random: '随机练习', wrong: '错题重做', fav: '收藏练习' };
      $('qTag').className = 'qtag' + (q.x ? ' warn' : '');
      $('qTag').innerHTML = (q.x ? '⚠ 答案待核实 · ' : '') + (tagNames[this.mode] || '练习') + ' · 第 ' + q.id + ' 题';
      $('qStem').innerHTML = esc(q.q);

      const ans = this.answered[id];
      const disp = this.getDisp(q);
      $('qOpts').innerHTML = disp.map((k, i) => {
        const o = q.o.find(x => x.k === k);
        const L = LETTERS[i];
        let cls = 'opt';
        if (ans) {
          cls += ' locked';
          if (k === q.a) cls += ' right';
          else if (k === ans.pick) cls += ' wrong';
          else cls += ' dim';
        }
        return `<div class="${cls}" data-k="${k}" onclick="App.pick('${k}')">
          <div class="k">${L}</div><div class="t">${esc(o.t)}</div></div>`;
      }).join('');

      const v = $('qVerdict');
      if (ans) {
        const ok = ans.pick === q.a;
        const rightText = q.o.find(o => o.k === q.a).t;
        const rightLetter = LETTERS[disp.indexOf(q.a)];
        v.className = 'verdict show ' + (ok ? 'ok' : 'no');
        v.innerHTML = ok
          ? `<div class="vi">✓</div><div><b>回答正确</b><span class="note">正确答案：${rightLetter}. ${esc(rightText)}</span></div>`
          : `<div class="vi">✕</div><div><b>回答错误</b><span class="note">正确答案：${rightLetter}. ${esc(rightText)}</span></div>`;
      } else {
        v.className = 'verdict';
        v.innerHTML = '';
      }

      $('nextBtn').textContent = this.idx >= total - 1 ? '完成练习' : '下一题';
      $('favBtn').innerHTML = (S.fav[id] ? '★ 已收藏' : '☆ 收藏');
      $('favBtn').style.color = S.fav[id] ? 'var(--gold)' : '';
    },
    pick(k) {
      const id = this.list[this.idx];
      if (this.answered[id]) return;
      const q = Q(id);
      const ok = k === q.a;
      this.answered[id] = { pick: k };
      // 记录
      S.done[id] = { r: ok ? 'right' : 'wrong', n: (S.done[id] ? S.done[id].n : 0) + 1, ts: Date.now() };
      if (ok) {
        if (S.wrong[id]) {
          S.wrong[id].pass = (S.wrong[id].pass || 0) + 1;
          if (S.wrong[id].pass >= 2) delete S.wrong[id]; // 连对2次移出错题本
        }
      } else {
        S.wrong[id] = { n: (S.wrong[id] ? S.wrong[id].n : 0) + 1, pass: 0, ts: Date.now() };
      }
      if (this.mode === 'order') S.pos = Math.max(S.pos, this.idx + 1);
      save();
      Sync.schedule();
      this.render();
      if (navigator.vibrate) navigator.vibrate(ok ? 12 : [18, 40, 18]);
      if (ok && this.autoNext !== false) {
        setTimeout(() => { if (this.answered[this.list[this.idx]] && this.list[this.idx] === id) this.nextQ(); }, 620);
      }
    },
    nextQ() {
      if (this.idx >= this.list.length - 1) {
        if (this.mode === 'exam') return Exam.submit();
        return this.finish();
      }
      this.idx++;
      this.render();
      this.scrollTop();
    },
    prevQ() {
      if (this.idx <= 0) return toast('已经是第一题了');
      this.idx--;

    },
    scrollTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); },
    finish() {
      if (this.mode === 'order') { S.pos = Math.min(this.list.length, this.idx + 1); save(); }
      go('home');
      const n = Object.keys(this.answered).length;
      if (n) toast('本轮完成 ' + n + ' 题');
    }
  };

  function start(mode) {
    if (mode === 'order') {
      const ids = BANK.map(q => q.id);
      let idx = S.pos;
      if (idx >= ids.length) idx = 0;
      Quiz.init(ids, 'order', idx);
      return;
    }
    if (mode === 'random') {
      let ids = BANK.map(q => q.id);
      ids = shuffle(ids);
      Quiz.init(ids, 'random', 0);
      return;
    }
  }
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ---------- 模拟考试 ---------- */
  const Exam = {
    active: false, ans: {}, idx: 0, t0: 0, timer: null, left: 0, list: [],
    start() {
      if (S.exam && S.exam.ans && Object.keys(S.exam.ans).length && !confirm('检测到上次未完成的考试，是否继续？')) {
        S.exam = null; save();
      }
      if (S.exam && S.exam.list) {
        this.list = S.exam.list; this.ans = S.exam.ans; this.t0 = S.exam.t0;
      } else {
        this.list = shuffle(BANK.map(q => q.id)).slice(0, Math.min(50, BANK.length));
        this.ans = {}; this.t0 = Date.now();
      }
      this.active = true;
      this.left = Math.max(0, 30 * 60 * 1000 - (Date.now() - this.t0));
      Quiz.init(this.list, 'exam', 0);
      this.runTimer();
      toast('开始考试 · 共 ' + this.list.length + ' 题 · 30 分钟');
    },
    runTimer() {
      clearInterval(this.timer);
      const tick = () => {
        this.left = Math.max(0, 30 * 60 * 1000 - (Date.now() - this.t0));
        const m = Math.floor(this.left / 60000), s = Math.floor(this.left % 60000 / 1000);
        const el = $('qPct');
        if (el) {
          el.textContent = m + ':' + String(s).padStart(2, '0');
          el.style.color = this.left < 300000 ? '#d92d20' : 'var(--red)';
          el.style.fontWeight = '700';
        }
        if (this.left <= 0) { clearInterval(this.timer); this.submit(); }
      };
      tick();
      this.timer = setInterval(tick, 1000);
    },
    answersCount() { return Object.keys(this.ans).length; },
    pick(id, k) {
      this.ans[id] = k;
      S.exam = { list: this.list, ans: this.ans, t0: this.t0 };
      save();
    },
    submit() {
      if (!this.active) return;
      clearInterval(this.timer);
      const filled = Object.keys(this.ans).length;
      if (filled < this.list.length) {
        if (!confirm('还有 ' + (this.list.length - filled) + ' 题未作答，确定交卷吗？')) { this.runTimer(); return; }
      }
      this.active = false;
      let ok = 0, wrongIds = [];
      this.list.forEach(id => {
        const q = Q(id);
        const pick = this.ans[id];
        const right = pick === q.a;
        if (right) ok++;
        else wrongIds.push(id);
        S.done[id] = { r: right ? 'right' : 'wrong', n: (S.done[id] ? S.done[id].n : 0) + 1, ts: Date.now() };
        if (!right) S.wrong[id] = { n: (S.wrong[id] ? S.wrong[id].n : 0) + 1, pass: 0, ts: Date.now() };
        else if (S.wrong[id]) { S.wrong[id].pass = (S.wrong[id].pass || 0) + 1; if (S.wrong[id].pass >= 2) delete S.wrong[id]; }
      });
      const used = Math.round((Date.now() - this.t0) / 1000);
      const score = Math.round(ok / this.list.length * 100);
      S.exam = null;
      S.examHist.unshift({ score, ok, total: this.list.length, used, ts: Date.now() });
      S.examHist = S.examHist.slice(0, 20);
      save();
      Sync.schedule();
      renderResult(score, ok, this.list.length, used, wrongIds);
    }
  };

  function renderResult(score, ok, total, used, wrongIds) {

    $('rsLabel').textContent = lb;
    $('rsOk').textContent = ok;
    $('rsNo').textContent = total - ok;
      const m = Math.floor(used / 60), s = used % 60;
    $('rsTime').textContent = m + "'" + String(s).padStart(2, '0') + '"';
    $('rsList').innerHTML = wrongIds.length
      ? `<div class="sec-t">答错的 ${wrongIds.length} 题（已加入错题本）</div>` + wrongIds.map(id => {
          const q = Q(id);
          return `<div class="qitem" onclick="App.openOne(${id})">
            <div class="qi-h"><span class="qi-n">${q.id}</span><div class="qi-s">${esc(q.q)}</div></div>
            <div class="qi-f"><i>答案 <span class="r">${esc(q.o.find(o=>o.k===q.a).t)}</span></i></div></div>`;
        }).join('')
      : `<div class="empty"><div class="em">🏆</div><b>全部答对！</b><p>太厉害了，这轮没有错题</p></div>`;
    go('result');
  }
  function retryExam() { Exam.start(); }

  /* ---------- 跨设备同步（GitHub 私有仓库存储） ---------- */
  function b64enc(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64dec(b64) {
    const bin = atob(String(b64).replace(/\s/g, ''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  // 按 ts 取较新记录合并，保证多设备进度只增不减
  function mergeStates(a, b) {
    const out = { done: {}, wrong: {}, fav: {}, pos: Math.max(a.pos || 0, b.pos || 0) };
    const pick = (x, y) => {
      if (!x) return y;
      if (!y) return x;
      return (y.ts || 0) > (x.ts || 0) ? y : x;
    };
    Object.keys(a.done || {}).concat(Object.keys(b.done || {})).forEach(id => {
      out.done[id] = pick(a.done[id], b.done[id]);
    });
    Object.keys(a.wrong || {}).concat(Object.keys(b.wrong || {})).forEach(id => {
      out.wrong[id] = pick(a.wrong[id], b.wrong[id]);
    });
    Object.keys(a.fav || {}).concat(Object.keys(b.fav || {})).forEach(id => {
      const x = a.fav[id], y = b.fav[id];
      out.fav[id] = x && y ? Math.min(x, y) : (x || y);
    });
    return out;
  }

  const Sync = {
    TOKEN_KEY: 'stbd_gh_token',
    REPO: 'xisixiang-tiku-sync',
    FILE: 'progress.json',
    busy: false, timer: null, login: '', repoReady: false,
    token() { try { return localStorage.getItem(this.TOKEN_KEY) || ''; } catch (e) { return ''; } },
    setToken(t) { try { localStorage.setItem(this.TOKEN_KEY, t); } catch (e) {} },
    clearToken() { try { localStorage.removeItem(this.TOKEN_KEY); } catch (e) {} },
    enabled() { return !!this.token(); },
    async gh(path, opts) {
      opts = opts || {};
      const r = await fetch('https://api.github.com' + path, {
        method: opts.method || 'GET',
        body: opts.body,
        headers: {
          'Authorization': 'Bearer ' + this.token(),
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        }
      });
      if (!r.ok) {
        let msg = '';
        try { msg = (await r.json()).message || ''; } catch (e) {}
        const err = new Error((r.status) + ' ' + msg);
        err.status = r.status;
        throw err;
      }
      return r.status === 204 ? null : r.json();
    },
    async ensure() {
      if (this.repoReady) return;
      const me = await this.gh('/user');
      this.login = me.login;
      try {
        await this.gh('/repos/' + this.login + '/' + this.REPO);
      } catch (e) {
        if (e.status !== 404) throw e;
        await this.gh('/user/repos', {
          method: 'POST',
          body: JSON.stringify({
            name: this.REPO, private: true, auto_init: true,
            description: '习思想题库 · 刷题进度自动同步（勿删）'
          })
        });
        await new Promise(r => setTimeout(r, 1600));
      }
      this.repoReady = true;
    },
    async pull() {
      try {
        const d = await this.gh('/repos/' + this.login + '/' + this.REPO + '/contents/' + this.FILE);
        return { sha: d.sha, data: JSON.parse(b64dec(d.content)) };
      } catch (e) {
        if (e.status === 404) return { sha: null, data: null };
        throw e;
      }
    },
    async push(data, sha) {
      const body = {
        message: 'sync progress ' + new Date().toISOString(),
        content: b64enc(JSON.stringify(data))
      };
      if (sha) body.sha = sha;
      body.branch = 'main';
      return this.gh('/repos/' + this.login + '/' + this.REPO + '/contents/' + this.FILE, {
        method: 'PUT', body: JSON.stringify(body)
      });
    },
    pack() { return { v: 1, at: Date.now(), done: S.done, wrong: S.wrong, fav: S.fav, pos: S.pos }; },
    async now(silent) {
      if (!this.enabled() || this.busy) return false;
      this.busy = true;
      try {
        await this.ensure();
        const remote = await this.pull();
        const local = this.pack();
        const merged = remote.data ? mergeStates(local, remote.data) : local;
        S.done = merged.done; S.wrong = merged.wrong; S.fav = merged.fav;
        S.pos = Math.max(S.pos || 0, merged.pos || 0);
        S.syncAt = Date.now();
        save();
        const sig = d => JSON.stringify([d.done || {}, d.wrong || {}, d.fav || {}, d.pos || 0]);
        if (!remote.data || sig(remote.data) !== sig(merged)) {
          await this.push(merged, remote.sha);
        }
        if (cur === 'home') renderHome();
        if (!silent) toast('已同步');
        return true;
      } catch (e) {
        if (!silent) toast('同步失败：' + String(e.message).slice(0, 44));
        return false;
      } finally {
        this.busy = false;
      }
    },
    // 做题后延迟合并上传，避免频繁请求
    schedule() {
      if (!this.enabled()) return;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.now(true), 2500);
    },
    reset() { this.login = ''; this.repoReady = false; }
  };

  /* ---------- 设置 ---------- */
  function openSettings() {
    const h = [];
    h.push(`<h3>设置</h3><div class="hint">做题记录保存在本机 · 版本 ${VER}</div>`);
    h.push(`<div style="display:flex;flex-direction:column;gap:10px">`);
    h.push(`<div style="background:#f7f8fa;border-radius:12px;padding:13px 14px;font-size:13.5px;color:#5b6470;line-height:1.75">
      共 <b>${BANK.length}</b> 道题，答案均对应原文档标注，已全部核对完毕。</div>`);
    h.push(`<div class="setrow" onclick="App.toggleShuf()">
      <div><b>随机选项顺序</b><span>打乱 ABCD 排列，避免靠字母记答案</span></div>
      <div class="sw ${S.shuf ? 'on' : ''}"><i></i></div>
    </div>`);
    const on = Sync.enabled();
    let desc;
    if (!on) desc = '手机和电脑共用一份进度';
    else if (Sync.busy) desc = '正在同步…';
    else desc = S.syncAt ? ('已开启 · ' + timeAgo(S.syncAt) + '同步') : '已开启 · 点此立即同步';
    h.push(`<div class="setrow" onclick="App.syncTap()">
      <div><b>跨设备同步</b><span>${desc}</span></div>
      <div class="sw ${on ? 'on' : ''}"><i></i></div>
    </div>`);
    h.push(`<button class="btn ghost" onclick="App.resumeSeq()">继续上次顺序进度（第 ${Math.min(S.pos + 1, BANK.length)} 题）</button>`);
    h.push(`<button class="btn ghost" style="color:#d92d20;border-color:#f5c2bd" onclick="App.resetAll()">清除全部记录</button>`);
    h.push(`</div><button class="btn main" style="margin-top:14px" onclick="App.closeSheet()">关闭</button>`);
    $('sheetbox').innerHTML = h.join('');
    $('mask').classList.add('on');
  }
  function resumeSeq() { closeSheet(); start('order'); }
  function timeAgo(ts) {
    const d = Date.now() - ts;
    if (d < 60000) return '刚刚';
    if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
    if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
    return Math.floor(d / 86400000) + ' 天前';
  }
  function syncTap() {
    if (!Sync.enabled()) return openSyncSetup();
    openSyncPanel();
  }
  function openSyncSetup() {
    $('sheetbox').innerHTML = `
      <h3>开启跨设备同步</h3>
      <div class="hint">用你的 GitHub 私有仓库保存进度，手机和电脑填同一个 token 即可</div>
      <textarea id="syncToken" class="syncinput" placeholder="粘贴 GitHub token（ghp_ 开头）" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <div class="tip">
        1. 打开 <a href="https://github.com/settings/tokens/new" target="_blank">github.com/settings/tokens/new</a><br>
        2. Note 随便填，勾选 <b>repo</b> 权限，生成后复制<br>
        3. 把 token 粘到上面，点下面的按钮<br>
        <span class="warn">token 只存在本机，不会上传到题库页面</span>
      </div>
      <button class="btn main" style="margin-top:12px" onclick="App.syncSaveToken()">保存并开始同步</button>
      <button class="btn ghost" style="margin-top:8px" onclick="App.closeSheet()">取消</button>`;
    $('mask').classList.add('on');
  }
  function openSyncPanel() {
    const when = S.syncAt ? timeAgo(S.syncAt) + '同步过' : '还没有同步记录';
    $('sheetbox').innerHTML = `
      <h3>跨设备同步</h3>
      <div class="hint">${Sync.busy ? '正在同步…' : '上次：' + when}</div>
      <div class="tip">进度保存在你的 GitHub 私有仓库（${esc(Sync.REPO)}），两台设备共用一份。关闭同步不会删除云端数据。</div>
      <button class="btn main" style="margin-top:12px" onclick="App.syncNowManual()">立即同步</button>
      <button class="btn ghost" style="margin-top:8px" onclick="App.syncOff()">关闭同步</button>
      <button class="btn ghost" style="margin-top:8px" onclick="App.closeSheet()">返回</button>`;
    $('mask').classList.add('on');
  }
  async function syncSaveToken() {
    const el = $('syncToken');
    const t = (el && el.value || '').trim();
    if (!t) { toast('请先粘贴 token'); return; }
    if (!/^[A-Za-z0-9_]{20,}$/.test(t)) { toast('token 格式看起来不对'); return; }
    const had = Sync.token();
    Sync.setToken(t); Sync.reset();
    try {
      await Sync.gh('/user');
    } catch (e) {
      Sync.setToken(had); Sync.reset();
      toast(String(e.message).indexOf('401') === 0 ? 'token 无效或已过期' : '校验失败：' + String(e.message).slice(0, 30));
      return;
    }
    closeSheet();
    toast('正在同步…');
    await Sync.now(false);
    if (cur === 'home' || cur === 'quiz') openSettings();
  }
  function syncOff() {
    if (!confirm('关闭同步？本机进度会保留，云端数据不会删除。')) return;
    Sync.clearToken(); Sync.reset();
    closeSheet(); openSettings(); toast('已关闭同步');
  }
  async function syncNowManual() {
    closeSheet();
    toast('正在同步…');
    await Sync.now(false);
    openSettings();
  }
  function toggleShuf() {
    S.shuf = !S.shuf;
    save();
    if (Quiz.disp) Quiz.disp = {};   // 清掉本次会话的缓存，立即生效
    if (cur === 'quiz') Quiz.render();
    openSettings();
    toast(S.shuf ? '已开启选项乱序' : '已关闭选项乱序');
  }
  function resetAll() {
    if (!confirm('将清除做题记录、错题本、收藏和考试记录，确定吗？')) return;
    S = DEF(); save(); closeSheet(); renderHome(); toast('已清除');
  }

  /* ---------- 启动 ---------- */
  // 静默检查更新：页面被缓存时自动拉取新版，无需用户手动刷新
  function checkUpdate() {
    try {
      if (typeof fetch !== 'function' || !location.protocol.startsWith('http')) return;
      fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
        .then(r => (r.ok ? r.text() : ''))
        .then(t => {
          const v = (t || '').trim();
          if (!v || !/^[0-9a-f]{6,}$/i.test(v)) return;
          if (v === VER) return;
          let done = '';
          try { done = sessionStorage.getItem('__upd_to') || ''; } catch (e) {}
          if (done === v) return;                 // 已尝试过，避免循环刷新
          try { sessionStorage.setItem('__upd_to', v); } catch (e) {}
          const u = new URL(location.href);
          u.searchParams.set('v', v);
          location.replace(u.toString());
        })
        .catch(() => {});
    } catch (e) {}
  }

  function boot() {
    load();
    renderHome();
    go('home');
    // 错题小红点
    const n = Object.keys(S.wrong).length;
    $('tabDot').innerHTML = n ? '<span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:#c8102e;vertical-align:4px;margin-left:2px"></span>' : '';
    // 延迟检查更新，不阻塞首屏
    setTimeout(checkUpdate, 1200);
    // 已开启同步则自动拉取一次
    if (Sync.enabled()) setTimeout(() => Sync.now(true), 2200);
    // 切到后台时保存一次，切回来时拉取一次
    try {
      document.addEventListener('visibilitychange', () => {
        if (!Sync.enabled()) return;
        if (document.hidden) Sync.now(true);
        else Sync.now(true);
      });
    } catch (e) {}
  }

  // 考试模式下点击选项
  const _origPick = Quiz.pick;
  Quiz.pick = function (k) {
    const id = this.list[this.idx];
    if (this.mode === 'exam') {
      if (Exam.ans[id]) return;
      Exam.pick(id, k);
      this.render();
      return;
    }
    _origPick.call(this, k);
  };
  Quiz.render = (function () {
    const orig = Quiz.render;
    return function () {
      orig.call(this);
      if (this.mode !== 'exam') return;
      const id = this.list[this.idx];
      const a = Exam.ans[id];
      if (!a) return;
      // 考试模式：只显示选中，不判对错
      const q = Q(id);
      [...$('qOpts').children].forEach(el => {
        el.className = 'opt locked';
        if (el.dataset.k === a) el.classList.add('sel');
      });
      $('qVerdict').className = 'verdict';
      $('qVerdict').innerHTML = '';
      // 考试模式：按钮显示为“交卷”
      $('nextBtn').textContent = this.idx >= this.list.length - 1 ? '交卷' : '下一题';
      $('qTag').className = 'qtag';
      $('qTag').innerHTML = '模拟考试 · 第 ' + (this.idx + 1) + ' / ' + this.list.length + ' 题';
    };
  })();

  return {
    boot, go, start, pick, nextQ, prevQ, exitQuiz, toggleFav,
    openSheet, closeSheet, jump, modeClick,
    renderHome, renderWrong, renderFav, startWrong, startFav, clearWrong, openOne,
    openSettings, resumeSeq, resetAll, retryExam, toggleShuf,
    syncTap, syncSaveToken, syncOff, syncNowManual
  };
})();

App.boot();

/* ===APP_END=== */
</script>
</body>
</html>
